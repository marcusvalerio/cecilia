<!DOCTYPE html>


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesversário da Cecília - 8 Meses
    <style>
        :root {
            --bg: #1a0f0b;
            --bg2: #24130e;
            --card: #fff8ef;
            --card2: #f8e8d8;
            --text: #2b1610;
            --muted: #6f4d3d;
            --red: #b63a2b;
            --orange: #d67a2c;
            --yellow: #f1c24f;
            --green: #5a7a4b;
            --shadow: 0 18px 50px rgba(0,0,0,.25);
            --radius: 22px;
        }


    - { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at top, rgba(241,194,79,.18), transparent 22%), 
                    radial-gradient(circle at 20% 10%, rgba(214,122,44,.18), transparent 18%), 
                    radial-gradient(circle at 85% 12%, rgba(90,122,75,.16), transparent 18%), 
                    linear-gradient(180deg, var(--bg), var(--bg2));
        min-height: 100vh;
        overflow-x: hidden;
    }

    .wrap { position: relative; max-width: 1100px; margin: 0 auto; padding: 22px 16px 36px; }

    .bandeirinhas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 72px;
        pointer-events: none;
        z-index: 1;
        opacity: .95;
        overflow: hidden;
    }

    .flag-row {
        position: absolute;
        top: 12px;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: space-around;
        gap: 10px;
    }

    .flag {
        width: 18px;
        height: 24px;
        border-radius: 3px 3px 8px 8px;
        clip-path: polygon(50% 100%, 0 0, 100% 0);
        animation: sway 3.6s ease-in-out infinite;
        box-shadow: 0 6px 12px rgba(0,0,0,.12);
    }

    .flag:nth-child(3n) { background: var(--yellow); }
    .flag:nth-child(3n+1) { background: var(--orange); }
    .flag:nth-child(3n+2) { background: var(--green); }

    @keyframes sway {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(4px) rotate(3deg); }
    }

    .hero { position: relative; z-index: 2; margin-top: 58px; padding: 24px 0 10px; color: #fff9f1; }
    h1 { margin: 0; font-size: clamp(2.4rem, 7vw, 5.4rem); line-height: .92; letter-spacing: -.04em; }
    .subtitle { margin: 12px 0 0; font-size: clamp(1rem, 2.8vw, 1.2rem); color: rgba(255,255,255,.83); }

    .grid { position: relative; z-index: 2; margin-top: 22px; display: grid; gap: 16px; }
    .card { 
        background: linear-gradient(180deg, rgba(255,248,239,.98), rgba(248,232,21,6,.98)); 
            border-radius: var(--radius); 
            box-shadow: var(--shadow); 
            padding: 20px;
        }

        .details { display: grid; gap: 12px; margin-top: 14px; }
        .detail { 
            display: flex; 
            align-items: flex-start; 
            gap: 12px; 
            padding: 14px; 
            border-radius: 16px; 
            background: rgba(255,255,255,.7); 
            border: 1px solid rgba(82,47,31,.08); 
        }

        button, .btn {
            appearance: none;
            border: 0;
            cursor: pointer;
            text-decoration: none;
            font: inherit;
            font-weight: 700;
            border-radius: 16px;
            padding: 14px 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 48px;
            transition: transform .2s ease;
        }

        .primary { background: var(--red); color: #fff; width: 100%; }
        .secondary { background: rgba(43,22,16,.08); color: var(--text); }

        /* Modal Styles */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(16,8,6,.62);
            backdrop-filter: blur(8px);
            z-index: 10;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }

        .modal-backdrop.open { display: flex; }
        .modal { 
            width: 100%; 
            max-width: 500px; 
            background: #fffaf2; 
            border-radius: 24px; 
            padding: 20px; 
            box-shadow: 0 24px 80px rgba(0,0,0,.35); 
        }

        input, textarea {
            width: 100%;
            margin-bottom: 12px;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid rgba(82,47,31,.14);
            font: inherit;
        }
    

<body>
    <div class="bandeirinhas">
        <div class="flag-row">
            <div class="flag"><div class="flag"><div class="flag">
            <div class="flag"><div class="flag"><div class="flag">
        
    

    <div class="wrap">

            <div class="details">
                <div class="detail">📅 27/06 às 15h
